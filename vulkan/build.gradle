plugins {
    id "dev.architectury.loom" version "1.13-SNAPSHOT"
}

version = rootProject.mod_version
archivesBaseName = "DistantHorizons-VulkanMod-fabric"

jar {
    archiveFileName = "${archivesBaseName}-${version}-mc${rootProject.minecraft_version}.jar"
}

remapJar {
    inputFile = jar.archiveFile
    archiveFileName = "DistantHorizons-VulkanMod-fabric-${version}-mc${rootProject.minecraft_version}.jar"
    dependsOn jar
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}@zip")
    }
    // Fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Distant Horizons — compile against the unmodified jar
    modCompileOnly files("${rootDir}/jars/DistantHorizons-2.4.5-b-1.21.11-fabric-neoforge.jar")

    // VulkanMod — compile against the jar
    modCompileOnly files("${rootDir}/jars/VulkanMod_1.21.11-0.6.1.jar")

    // LWJGL vulkan types (VkCommandBuffer, MemoryStack) surfaced by VulkanMod's API
    compileOnly "org.lwjgl:lwjgl:3.3.4"
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.4"
}
